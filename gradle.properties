# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# JDK location: not pinned here so each machine uses its own JDK
# (Android Studio JBR, JAVA_HOME, or java on PATH). To pin a specific
# JDK on a given machine, set org.gradle.java.home in
# ~/.gradle/gradle.properties (user-level, not committed).

# Specifies the JVM arguments used for daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Enable configuration caching (faster builds)
org.gradle.configuration-cache=true
